<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>FIP Stats Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="brand big"><span class="dot"></span>FIP Stats <em>Desktop</em></div>
      <p class="muted">Accedi con l'account che usi nell'app FIP Stats.</p>
      <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
      <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary" id="login-btn">Accedi</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="drag"></div>
      <div class="brand"><span class="dot"></span>FIP Stats <em>Desktop</em></div>
      <nav>
        <a href="#/home" data-nav="home">Home</a>
        <a href="#/search" data-nav="search">Cerca</a>
        <a href="#/follows" data-nav="follows">Seguiti</a>
        <a href="#/account" data-nav="account">Account</a>
      </nav>
      <div class="sidebar-foot">
        <label class="season-pick">Stagione
          <select id="season-select"></select>
        </label>
        <div id="user-badge" class="user-badge"></div>
      </div>
    </aside>
    <main id="main">
      <div class="drag top"></div>
      <div id="view"></div>
    </main>
    <button id="back-btn" class="back-btn hidden" title="Indietro (⌘[)" aria-label="Indietro">‹</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
